[workspace]
authors = ["imendezval <inigomendezval@gmail.com>"]
channels = ["conda-forge"]
name = "NextWatch"
platforms = ["linux-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy apps tests"
test = "pytest tests"
dvc-init = "dvc init"
dvc-status = "dvc status"
ingest = "python apps/ingest/run.py"
duckdb = "python scripts/duckdb_sanity.py"

[dependencies]
python = "3.11.*"
dvc-s3 = ">=3.3.0,<4"
pandas = ">=3.0.2,<4"
pyarrow = ">=24.0.0,<25"
duckdb = ">=1.5.2,<2"
requests = ">=2.33.1,<3"
tenacity = ">=9.1.4,<10"
python-dotenv = ">=1.2.2,<2"
pydantic = ">=2.13.3,<3"
rich = ">=15.0.0,<16"
pandera = ">=0.31.1,<0.32"
pytest = ">=9.0.3,<10"
ruff = ">=0.15.11,<0.16"
mypy = ">=1.20.2,<2"
